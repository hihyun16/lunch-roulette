<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="오늘 점심은 뭐 먹지? 결정 장애를 해결해 주는 프리미엄 점심 메뉴 추천 룰렛! 내 메뉴를 추가하고 시원하게 돌려보세요.">
  <title>점심메뉴 추천 룰렛 | Lunch Roulette</title>
  <!-- Google Fonts 적용 (Outfit & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 전체 배경을 채우는 Confetti 효과용 Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <i data-lucide="utensils-cross"></i>
        <span>LUNCH ROULETTE</span>
      </div>
      <h1>오늘 점심 뭐 먹지?</h1>
      <p class="subtitle">선택 장애 해결사! 나만의 점심 메뉴 룰렛을 돌려보세요.</p>
    </header>

    <main class="main-content">
      <!-- 룰렛 섹션 -->
      <section class="roulette-section card">
        <div class="roulette-container">
          <!-- 룰렛 포인터 (상단 삼각 화살표) -->
          <div class="pointer-wrapper">
            <div class="roulette-pointer"></div>
          </div>
          <!-- 룰렛 휠 Canvas -->
          <canvas id="roulette-canvas" width="450" height="450"></canvas>
          <!-- 중앙 고정 핀/돌리기 버튼 -->
          <button id="spin-button-center" aria-label="룰렛 돌리기">
            <span>GO!</span>
          </button>
        </div>
        <div class="control-box">
          <button id="spin-button" class="btn btn-primary btn-large">
            <i data-lucide="play"></i> 룰렛 돌리기 <span class="hotkey">(Space)</span>
          </button>
        </div>
      </section>

      <!-- 메뉴 설정 섹션 -->
      <section class="menu-section card">
        <div class="section-title-area">
          <h2><i data-lucide="settings"></i> 메뉴 라인업</h2>
          <span class="menu-count">현재 <strong id="current-count">0</strong>개</span>
        </div>

        <form id="menu-form" class="menu-input-group">
          <input type="text" id="menu-input" placeholder="새로운 메뉴를 입력하세요 (최대 10자)" maxlength="10" autocomplete="off" required>
          <button type="submit" class="btn btn-secondary">
            <i data-lucide="plus"></i> 추가
          </button>
        </form>

        <div class="menu-list-wrapper">
          <div id="menu-list" class="menu-chips-container">
            <!-- JavaScript에서 동적으로 메뉴 칩들을 추가함 -->
          </div>
        </div>

        <div class="menu-actions">
          <button id="reset-button" class="btn btn-outline">
            <i data-lucide="rotate-ccw"></i> 기본 메뉴로 초기화
          </button>
          <button id="clear-button" class="btn btn-danger-outline">
            <i data-lucide="trash-2"></i> 전체 삭제
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 Lunch Roulette. Designed for your delicious decision.</p>
    </footer>
  </div>

  <!-- 결과 모달 창 -->
  <div id="result-modal" class="modal-overlay hidden">
    <div class="modal-content card">
      <div class="modal-decoration">
        <i data-lucide="crown" class="icon-crown"></i>
      </div>
      <p class="modal-subtitle">오늘의 점심 추천 메뉴!</p>
      <h2 id="result-menu-name">제육볶음</h2>
      <div class="modal-buttons">
        <button id="modal-retry-button" class="btn btn-primary">
          <i data-lucide="rotate-cw"></i> 다시 돌리기
        </button>
        <button id="modal-close-button" class="btn btn-outline">
          <i data-lucide="check"></i> 결정완료! 맛있게 먹기
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Lucide 아이콘 렌더링
    lucide.createIcons();
  </script>
</body>
</html>
